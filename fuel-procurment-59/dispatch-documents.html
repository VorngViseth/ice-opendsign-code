<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dispatch receipts · Sok Heng</title></head>

<script>
const target=new URL('driver-sales.html',location.href);
target.search=location.search;
target.searchParams.delete('view');
target.searchParams.set('tab','receipts');
